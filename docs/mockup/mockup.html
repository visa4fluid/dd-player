                                    <button class="match-act is-icon" type="button" title="Pausa" ?disabled=${item.status !== 'running'} @pointerdown=${(event) => event.stopPropagation()} @click=${stop(() => pausePalinsesto(item))}
                                    ><md-icon>pause</md-icon></button>
                                    <button class="match-act is-icon" type="button" title="Stop" ?disabled=${item.status === 'idle'} @pointerdown=${(event) => event.stopPropagation()} @click=${stop(() => stopPalinsesto(item))}
                                    ><md-icon>stop</md-icon></button>
                                  </div>
                                </div>`)}
                              </div>
                            ` : widget.type === 'rundown' ? html`
                              ${onAirPalinsesto.value ? html`<div class="rundown">
                                <div class="rundown-head">
                                  <span class=${'widget-dot ' + (palinsestoDot(onAirPalinsesto.value.status) || '')}></span>
                                  <span class="rundown-name">${onAirPalinsesto.value.title}</span>
                                  <span class=${classMap({ 'palinsesto-time': true, 'is-idle': onAirPalinsesto.value.status === 'idle' })}>
                                    ${formatTenths(onAirPalinsesto.value.elapsed)}
                                  </span>
                                  <span class=${'palinsesto-status ' + ('is-' + onAirPalinsesto.value.status || '')}>
                                    ${palinsestoStatusLabel(onAirPalinsesto.value.status)}
                                  </span>
                                </div>
                                ${onAirRundown.value.rows.map((item) => html`<div class=${classMap({ 'rundown-item': true, 'is-now': item.now, 'is-past': item.past })} style=${"--progress: " + item.progress + "%"}>
                                  <span class="rundown-item-fill"></span>
                                  <span class="rundown-item-role">${item.role}</span>
                                  <span class="rundown-item-title">${item.title}</span>
                                  <span class="rundown-item-time">
                                    ${item.now ? formatTenths(item.local) + ' / ' + formatTenths(item.duration) : formatTenths(item.duration)}
                                  </span>
                                </div>`)}
                              </div>` : html`<div class="rundown-empty">Nessun palinsesto in onda</div>`}
                            ` : widget.type === 'match' ? html`
                              ${activeMatch.value ? html`<div class="match">
                                <div class="match-clock">
                                  <span class=${classMap({ 'widget-dot': true, 'is-off': !activeMatch.value.running, 'is-warn': activeMatch.value.running })}></span>
                                  <button class="match-period" type="button" @pointerdown=${(event) => event.stopPropagation()} @click=${stop(cycleMatchPeriod)}>
                                    ${activeMatch.value.periods[activeMatch.value.period]}
                                  </button>
                                  <span class="match-time">${matchClockLabel()}</span>
                                  <button class="match-act" type="button" @pointerdown=${(event) => event.stopPropagation()} @click=${stop(toggleMatchClock)}>
                                    ${activeMatch.value.running ? 'Pausa' : 'Avvia'}
                                  </button>
                                </div>
                                <div class="match-score">
                                  <div class="match-team">
                                    <span class="match-team-name">${activeMatch.value.home.name}</span>
                                    <span class="match-team-code">${activeMatch.value.home.code}</span>
                                    <div class="match-team-acts">
                                      <button class="match-act" type="button" title="Gol" @pointerdown=${(event) => event.stopPropagation()} @click=${stop(() => addMatchGoal('home'))}>Gol</button>
                                      <button class="match-act is-yellow" type="button" title="Giallo" @pointerdown=${(event) => event.stopPropagation()} @click=${stop(() => addMatchCard('home', 'yellow'))}>G</button>
                                      <button class="match-act is-red" type="button" title="Rosso" @pointerdown=${(event) => event.stopPropagation()} @click=${stop(() => addMatchCard('home', 'red'))}>R</button>
                                      <button class="match-act" type="button" title="Sostituzione" @pointerdown=${(event) => event.stopPropagation()} @click=${stop(() => addMatchSub('home'))}>Sub</button>
                                    </div>
                                  </div>
                                  <div class="match-score-box">
                                    <span>${matchScore('home')}</span>
                                    <em>—</em>
                                    <span>${matchScore('away')}</span>
                                  </div>
                                  <div class="match-team is-away">
                                    <span class="match-team-name">${activeMatch.value.away.name}</span>
                                    <span class="match-team-code">${activeMatch.value.away.code}</span>
                                    <div class="match-team-acts">
                                      <button class="match-act" type="button" title="Gol" @pointerdown=${(event) => event.stopPropagation()} @click=${stop(() => addMatchGoal('away'))}>Gol</button>
                                      <button class="match-act is-yellow" type="button" title="Giallo" @pointerdown=${(event) => event.stopPropagation()} @click=${stop(() => addMatchCard('away', 'yellow'))}>G</button>
                                      <button class="match-act is-red" type="button" title="Rosso" @pointerdown=${(event) => event.stopPropagation()} @click=${stop(() => addMatchCard('away', 'red'))}>R</button>
                                      <button class="match-act" type="button" title="Sostituzione" @pointerdown=${(event) => event.stopPropagation()} @click=${stop(() => addMatchSub('away'))}>Sub</button>
                                    </div>
                                  </div>
                                </div>
                                <div class="match-officials">
                                  <div class="match-roster-title">Arbitri</div>
                                  <div class="match-officials-grid">
                                    ${activeMatch.value.officials.map((official) => html`<div class="match-official">
                                      <span class="match-official-role">${official.role}</span>
                                      <span class="match-official-name">${official.name}</span>
                                    </div>`)}
                                  </div>
                                </div>
                                <div class="match-rosters">
                                  <div class="match-roster">
                                    <div class="match-roster-cols">
                                      <div>
                                        <div class="match-roster-title">Titolari</div>
                                        ${activeMatch.value.home.starters.map((player) => html`<div class="match-player">
                                          <span class="match-player-num">${player.num}</span>
                                          <span>${player.name}</span>
                                        </div>`)}
                                      </div>
                                      <div>
                                        <div class="match-roster-title">Panchina</div>
                                        ${activeMatch.value.home.bench.map((player) => html`<div class="match-player">
                                          <span class="match-player-num">${player.num}</span>
                                          <span>${player.name}</span>
                                        </div>`)}
                                      </div>
                                    </div>
                                  </div>
                                  <div class="match-roster is-away">
                                    <div class="match-roster-cols">
                                      <div>
                                        <div class="match-roster-title">Panchina</div>
                                        ${activeMatch.value.away.bench.map((player) => html`<div class="match-player">
                                          <span>${player.name}</span>
                                          <span class="match-player-num">${player.num}</span>
                                        </div>`)}
                                      </div>
                                      <div>
                                        <div class="match-roster-title">Titolari</div>
                                        ${activeMatch.value.away.starters.map((player) => html`<div class="match-player">
                                          <span>${player.name}</span>
                                          <span class="match-player-num">${player.num}</span>
                                        </div>`)}
                                      </div>
                                    </div>
                                  </div>
                                </div>
                                <div class="match-events">
                                  ${recentMatchEvents().map((event) => html`<div class=${classMap({ 'match-event': true, 'is-away': event.team === 'away' })}>
                                    <span class="match-event-min">${event.minute}</span>
                                    <span class="match-event-name">
                                      <span class=${'widget-dot ' + (matchEventDot(event.type) || '')}></span>
                                      ${event.text}
                                    </span>
                                    <span class="match-event-meta">${matchEventLabel(event.type)}</span>
                                  </div>`)}
                                </div>
                              </div>` : nothing}
                            ` : widget.type === 'scheduler' ? html`
                              <div class="scheduler">
                                ${widgetScheduler(widget).length ? html`<div class="scheduler-stage">
                                  ${widgetScheduler(widget).map((output) => html`<div class="scheduler-group">
                                    <div class="scheduler-group-title">${output.name}</div>
                                    ${schedulerLayers.map((layer) => html`<div class="scheduler-row">
                                      <div class="scheduler-label">${layer.name}</div>
                                      <div class="scheduler-track">
                                        ${output[layer.id].map((clip) => html`<div class="scheduler-clip" style=${styleMap(clipStyle(clip, schedulerMaxDuration(widget)))}>
                                          <span class="scheduler-clip-fill"></span>
                                          <span class="scheduler-clip-title">${clip.title}</span>
                                        </div>`)}
                                      </div>
                                    </div>`)}
                                  </div>`)}
                                </div>` : html`<div class="scheduler-empty">Nessun contenuto sul peer</div>`}
                              </div>
                            ` : widget.type === 'preview' ? html`
                              ${widgetWindows(widget).length ? html`<div class="preview-stage">
                                ${widgetWindows(widget).map((win) => html`<div class=${classMap({ 'preview-window': true, 'is-off': !win.online })}>
                                  <div class="preview-bezel">
                                    ${win.layout === 'composite' ? html`<div class="preview-screen is-composite">
                                      <div class="preview-layer is-fullscreen">
                                        <span class="preview-layer-name">${windowDevice(win, 'fullscreen').name}</span>
                                      </div>
                                      <div class="preview-composite">
                                        <div class="preview-layer is-main">
                                          <span class="preview-layer-name">${windowDevice(win, 'main').name}</span>
                                          <div class="preview-hud">
                                            <span class="preview-live">LIVE</span>
                                            <span class="preview-clock">${windowDevice(win, 'main').time}</span>
                                          </div>
                                          <div class="preview-center">
                                            <div class="preview-teams">
                                              <span>${windowDevice(win, 'main').home}</span>
                                              <span class="preview-score">${windowDevice(win, 'main').score}</span>
                                              <span>${windowDevice(win, 'main').away}</span>
                                            </div>
                                          </div>
                                        </div>
                                        <div class="preview-layer is-totem">
                                          <span class="preview-layer-name">${windowDevice(win, 'totem').name}</span>
                                          <div class="preview-sponsor">${windowDevice(win, 'totem').title}</div>
                                          <div class="preview-sponsor-sub">${windowDevice(win, 'totem').item}</div>
                                        </div>
                                        <div class="preview-layer is-ticker">
                                          <span class="preview-layer-name">${windowDevice(win, 'ticker').name}</span>
                                          <div class="preview-ticker-text">
                                            <span>${windowDevice(win, 'ticker').item}</span>
                                          </div>
                                        </div>
                                      </div>
                                    </div>` : html`<div class=${'preview-screen ' + ('is-' + (windowDevice(win, 'fullscreen').theme || 'idle') || '')}>
                                      <span class="preview-layer-name">${windowDevice(win, 'fullscreen').name}</span>
                                      <div class="preview-hud">
                                        ${windowDevice(win, 'fullscreen').live ? html`<span class="preview-live">LIVE</span>` : html`<span class="preview-live is-loop">LOOP</span>`}
                                        <span class="preview-clock">${windowDevice(win, 'fullscreen').time}</span>
                                      </div>
                                      <div class="preview-center">
                                        ${windowDevice(win, 'fullscreen').theme === 'led' ? html`<div class="preview-teams">
                                          <span>${windowDevice(win, 'fullscreen').home}</span>
                                          <span class="preview-score">${windowDevice(win, 'fullscreen').score}</span>
                                          <span>${windowDevice(win, 'fullscreen').away}</span>
                                        </div>` : html`<div>
                                          <div class="preview-sponsor">${windowDevice(win, 'fullscreen').title}</div>
                                          <div class="preview-sponsor-sub">${windowDevice(win, 'fullscreen').subtitle}</div>
                                        </div>`}
                                      </div>
                                      <div class="preview-now">${windowDevice(win, 'fullscreen').item}</div>
                                    </div>`}
                                  </div>
                                  <div class="preview-caption">
                                    <strong>${win.name}</strong>
                                    <span>${windowDeviceNames(win)}</span>
                                  </div>
                                </div>`)}
                              </div>` : html`<div class="preview-empty">Nessuna finestra sul peer</div>`}
                            ` : widget.type === 'host' ? html`
                              <div class="widget-row">
                                <span class="widget-dot"></span>
                                <span class="widget-row-name">GPU · ${state.host.gpuName}</span>
                                <span class="widget-row-meta">${state.host.gpuUsage}% · ${state.host.gpuTotal}</span>
                              </div>
                              <div class="widget-row">
                                <span class="widget-dot"></span>
                                <span class="widget-row-name">CPU totale</span>
                                <span class="widget-row-meta">${state.host.cpuUsage}%</span>
                              </div>
                              <div class="widget-row">
                                <span class="widget-dot"></span>
                                <span class="widget-row-name">Memoria fisica</span>
                                <span class="widget-row-meta">${state.host.ramUsed} / ${state.host.ramTotal}</span>
                              </div>
                              <div class="widget-row">
                                <span class=${classMap({ 'widget-dot': true, 'is-off': !state.host.online })}></span>
                                <span class="widget-row-name">Internet</span>
                                <span class=${classMap({ 'widget-row-meta': true, 'is-muted': !state.host.online })}>
                                  ${state.host.online ? 'connesso' : 'non connesso'}
                                </span>
                              </div>
                              <div class="widget-row">
                                <span class=${classMap({ 'widget-dot': true, 'is-idle': !widgetDevice(widget)?.ip })}></span>
                                <span class="widget-row-name">IP</span>
                                <span class=${classMap({ 'widget-row-meta': true, 'is-muted': !widgetDevice(widget)?.ip })}>
                                  ${widgetDevice(widget)?.ip || '—'}
                                </span>
                              </div>
                              <div class="widget-row">
                                <span class=${classMap({ 'widget-dot': true, 'is-idle': widgetMonitorCount(widget) === 0 })}></span>
                                <span class="widget-row-name">Monitor</span>
                                <span class=${classMap({ 'widget-row-meta': true, 'is-muted': widgetMonitorCount(widget) === 0 })}>
                                  ${widgetMonitorCount(widget)}
                                </span>
                              </div>
                            ` : widget.type === 'surfaces' ? html`
                              <div class="widget-row">
                                <span class="widget-dot"></span>
                                <span class="widget-row-name">Milan Maxi</span>
                                <span class="widget-row-meta">online</span>
                              </div>
                              <div class="widget-row">
                                <span class="widget-dot"></span>
                                <span class="widget-row-name">Milan Sideline</span>
                                <span class="widget-row-meta">rifolto</span>
                              </div>
                              <div class="widget-row">
                                <span class="widget-dot is-idle"></span>
                                <span class="widget-row-name">Bordocampo Fila 1</span>
                                <span class="widget-row-meta is-muted">—</span>
                              </div>
                              <div class="widget-row">
                                <span class="widget-dot"></span>
                                <span class="widget-row-name">Bordocampo Fila 2</span>
                                <span class="widget-row-meta">pronta</span>
                              </div>
                            ` : widget.type === 'session' ? html`
                              <div class="widget-row">
                                <span class="widget-dot"></span>
                                <span class="widget-row-name">Tenant Fluid Next</span>
                                <span class="widget-row-meta">attiva</span>
                              </div>
                              <div class="widget-row">
                                <span class="widget-dot"></span>
                                <span class="widget-row-name">Sync locale</span>
                                <span class="widget-row-meta is-muted">ok</span>
                              </div>
                            ` : widget.type === 'playlist' ? html`
                              <div class="widget-row">
                                <span class="widget-dot"></span>
                                <span class="widget-row-name">Match day · loop</span>
                                <span class="widget-row-meta">4 / 12</span>
                              </div>
                              <div class="widget-row">
                                <span class="widget-dot is-warn"></span>
                                <span class="widget-row-name">Item corrente</span>
                                <span class="widget-row-meta is-muted">00:42</span>
                              </div>
                            ` : widget.type === 'mixer' ? html`
                              <md-slider min="0" max="100" labeled .value=${state.mixer} @input=${(event) => { state.mixer = Number(event.target.value); }}
                                @pointerdown=${(event) => event.stopPropagation()}
                              ></md-slider>
                            ` : widget.type === 'nova' ? html`
                              <div class="widget-row">
                                <span class="widget-dot"></span>
                                <span class="widget-row-name">Processore collegato</span>
                                <span class="widget-row-meta">online</span>
                              </div>
                              <div class="widget-row">
                                <span class="widget-dot"></span>
                                <span class="widget-row-name">Input 2</span>
                                <span class="widget-row-meta is-muted">80%</span>
                              </div>
                            ` : widget.type === 'notes' ? html`
                              <md-filled-text-field class="notes-field" type="textarea" rows="3" label="Note" .value=${state.notes} @input=${(event) => { state.notes = event.target.value; }}
                                @pointerdown=${(event) => event.stopPropagation()}
                              ></md-filled-text-field>
                            ` : html`
                              <div class="widget-row">
                                <span class="widget-dot"></span>
                                <span class="widget-row-name">System</span>
                                <span @pointerdown=${(event) => event.stopPropagation()} @click=${stop(() => openModule('system'))}>
                                  <md-text-button type="button">Apri</md-text-button>
                                </span>
                              </div>
                              <div class="widget-row">
                                <span class="widget-dot"></span>
                                <span class="widget-row-name">Playlist</span>
                                <span @pointerdown=${(event) => event.stopPropagation()} @click=${stop(() => openModule('playlist'))}>
                                  <md-text-button type="button">Apri</md-text-button>
                                </span>
                              </div>
                              <div class="widget-row">
                                <span class="widget-dot"></span>
                                <span class="widget-row-name">Nova</span>
                                <span @pointerdown=${(event) => event.stopPropagation()} @click=${stop(() => openModule('nova'))}>
                                  <md-text-button type="button">Apri</md-text-button>
                                </span>
                              </div>
                            `}
                          </div>
                          <i class="mdi mdi-resize-bottom-right grip" resize="bottom-right"></i>
                        </div>
                        </div>`)}
                        <div placeholder></div>
                      </lit-grid>
                    </div>
                  </div>` : nothing}
                </div>
              </div>
            </div>
            </div>

            <md-dialog class="add-dialog" .open=${state.addOpen} @closed=${onAddDialogClosed}>
              <div slot="headline" class="dialog-headline">
                ${state.addStep === 'widgets' ? 'Scegli widget' : 'Aggiungi widget'}
              </div>
              <div slot="content" class="dialog-content">
                ${!connectedDevices.value.length ? html`
                  <p class="dialog-copy">
                    Connettiti a un dispositivo per creare e comandare i widget di quel peer.
                  </p>
                ` : state.addStep === 'peers' ? html`
                  <p class="dialog-copy">Scegli il peer connesso a cui associare il widget.</p>
                  <md-list>
                    ${connectedDevices.value.map((device) => html`<md-list-item type="button" class=${classMap({ 'is-on': state.addDeviceId === device.id })} @click=${() => { selectAddDevice(device.id); }}
                    >
                      <md-icon slot="start">${state.addDeviceId === device.id ? 'radio_button_checked' : 'radio_button_unchecked'}</md-icon>
                      <div slot="headline">${device.name}</div>
                      <div slot="supporting-text">${deviceActiveSystem(device)?.name || 'Nessun sistema associato'}</div>
                    </md-list-item>`)}
                  </md-list>
                ` : html`<md-list>
                  ${widgetCatalog.map((item) => html`<md-list-item type="button" @click=${() => { addWidget(item.type); }}
                  >
                    <md-icon slot="start">${item.md}</md-icon>
                    <div slot="headline">${item.title}</div>
                  </md-list-item>`)}
                </md-list>`}
              </div>
              <div slot="actions" class="dialog-actions">
                ${state.addStep === 'widgets' ? html`<md-text-button type="button" @click=${() => { state.addStep = 'peers'; }}
                >Indietro</md-text-button>` : nothing}
                <md-text-button type="button" @click=${() => { state.addOpen = false; }}>
                  ${connectedDevices.value.length ? 'Annulla' : 'Chiudi'}
                </md-text-button>
                ${!connectedDevices.value.length ? html`<md-filled-tonal-button type="button" @click=${() => { openModule('host'); state.addOpen = false; }}
                >Vai a Dispositivi</md-filled-tonal-button>` : state.addStep === 'peers' ? html`<md-filled-button type="button" ?disabled=${!state.addDeviceId} @click=${goAddWidgetTypes}>Avanti</md-filled-button>` : nothing}
              </div>
            </md-dialog>
            <md-dialog class="rename-dialog" .open=${state.workspaceEditOpen} @closed=${() => { state.workspaceEditOpen = false; }}
            >
              <div slot="headline" class="dialog-headline">Rinomina area di lavoro</div>
              <div slot="content" class="dialog-content">
                <md-filled-text-field id="workspace-name" label="Nome" .value=${state.workspaceEditName} @input=${(event) => { state.workspaceEditName = event.target.value; }}
                  @keydown=${(event) => { if (event.key === "Enter") { event.preventDefault(); saveRenameWorkspace(); } }}
                ></md-filled-text-field>
              </div>
              <div slot="actions" class="dialog-actions">
                <md-text-button type="button" @click=${() => { state.workspaceEditOpen = false; }}>Annulla</md-text-button>
                <md-filled-button type="button" ?disabled=${!state.workspaceEditName.trim()} @click=${saveRenameWorkspace}>Salva</md-filled-button>
              </div>
            </md-dialog>
          </div>
            `;
          }

          drawView = view;
          scheduleDraw();
          queueMicrotask(() => mountFns.forEach((fn) => fn()));
          window.addEventListener("beforeunload", () => unmountFns.forEach((fn) => fn()));
      }
    </script>
  </body>
</html>
