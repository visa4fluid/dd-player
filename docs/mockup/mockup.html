<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Regista — Mockup</title>
    <style>
      :root {
        --md-sys-color-primary: #7ec8bc;
        --md-sys-color-on-primary: #003732;
        --md-sys-color-surface: #152832;
        --md-sys-color-on-surface: #e8eef2;
        --md-sys-color-on-surface-variant: #8aa0ab;
        --md-sys-color-surface-container: #1a3340;
        --md-sys-color-surface-container-highest: #1a3340;
        --md-sys-color-outline: rgba(126, 200, 188, 0.35);
        --md-icon-font: "Material Symbols Outlined";
        --md-ref-typeface-brand: "Roboto", sans-serif;
        --md-ref-typeface-plain: "Roboto", sans-serif;
      }
      html, body, #app {
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family: "Roboto", sans-serif;
      }
      button,
      input,
      textarea,
      select {
        font-family: inherit;
      }
      .bg-background { background: #0f1c24; }
      .pa-2 { padding: 8px; }
      .pa-3 { padding: 12px; }
      .mb-2 { margin-bottom: 8px; }
      .text-medium-emphasis { color: #8aa0ab; }
      .text-body-2 { font-size: 14px; line-height: 1.4; }
      .text-caption { font-size: 12px; line-height: 1.35; }
      .regista-shell {
        display: flex;
        flex-direction: row;
        align-items: stretch;
        height: 100%;
        background: #0f1c24;
      }
      .regista-column {
        position: relative;
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
        min-height: 0;
      }
      .regista-main {
        flex: 1;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      app-navigation-drawer {
        align-self: stretch;
        height: 100%;
      }
      app-navigation-drawer[location='end'],
      app-navigation-drawer[location='right'] {
        order: 2;
      }
      app-navigation-drawer::part(panel) {
        height: 100%;
        min-height: 100%;
        border: 0;
        border-radius: 0;
      }
      app-navigation-drawer::part(content) {
        flex: 1;
        min-height: 0;
      }
      app-header md-icon-button,
      app-header md-icon,
      app-navigation-drawer md-icon {
        --md-icon-button-icon-color: #7ec8bc;
        color: #7ec8bc;
      }
      app-header md-icon-button.is-on md-icon {
        font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24;
      }
      .nav {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        box-sizing: border-box;
        height: 100%;
        padding: 8px 4px;
      }
      .nav-btn {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        padding: 0;
        border: 1px solid #0a161c;
        border-radius: 4px;
        background: linear-gradient(180deg, #2a4d5c 0%, #1c3a48 52%, #15303c 100%);
        color: #7ec8bc;
        cursor: pointer;
        box-shadow:
          inset 1px 1px 0 rgba(255, 255, 255, 0.16),
          inset -1px -1px 0 rgba(0, 0, 0, 0.35),
          0 2px 0 #0a161c,
          0 3px 5px rgba(0, 0, 0, 0.45);
      }
      .nav-btn:hover {
        background: linear-gradient(180deg, #326072 0%, #224554 52%, #1a3844 100%);
      }
      .nav-btn md-icon {
        font-size: 22px;
      }
      .nav-btn.is-active {
        background: linear-gradient(180deg, #0c161c 0%, #122430 100%);
        box-shadow:
          inset 1px 2px 4px rgba(0, 0, 0, 0.7),
          inset -1px -1px 0 rgba(126, 200, 188, 0.08),
          0 0 0 1px rgba(0, 0, 0, 0.45);
        transform: translateY(2px);
      }
      .nav-btn.is-active md-icon {
        font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24;
      }
      .v-navigation-drawer__content {
        overflow-y: auto;
        scrollbar-width: none;
      }
      .v-navigation-drawer__content::-webkit-scrollbar { display: none; }
      .rail-group-divider {
        display: block;
        box-sizing: border-box;
        height: 1px;
        width: 24px;
        max-width: 24px;
        min-width: 0;
        margin: 10px auto;
        padding: 0;
        align-self: center;
        flex: 0 0 auto;
        background: rgba(126, 200, 188, 0.45);
      }
      .pane-grid { display: grid; flex: 1; height: auto; min-height: 0; }
      .nav-portion-close {
        position: absolute;
        top: 6px;
        right: 6px;
        z-index: 4;
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: #8aa0ab;
        cursor: pointer;
      }
      .nav-portion-close:hover {
        color: #e8eef2;
        background: #1a3340;
      }
      .nav-portion-close md-icon {
        font-size: 18px;
      }
      .system-device-bar {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 40px 10px 12px;
        border-bottom: 1px solid rgba(126, 200, 188, 0.16);
        background: #13242c;
        --md-sys-color-primary: #7ec8bc;
        --md-sys-color-on-primary: #003732;
        --md-sys-color-on-surface: #e8eef2;
        --md-sys-color-on-surface-variant: #8aa0ab;
        --md-outlined-select-text-field-container-shape: 4px;
        --md-outlined-select-text-field-container-height: 36px;
        --md-outlined-field-top-space: 4px;
        --md-outlined-field-bottom-space: 4px;
        --md-outlined-select-text-field-label-text-size: 11px;
        --md-outlined-select-text-field-input-text-size: 12px;
        --md-outlined-select-text-field-outline-color: rgba(126, 200, 188, 0.28);
        --md-outlined-select-text-field-hover-outline-color: #7ec8bc;
        --md-outlined-select-text-field-focus-outline-color: #7ec8bc;
        --md-outlined-select-text-field-label-text-color: #8aa0ab;
        --md-outlined-select-text-field-input-text-color: #e8eef2;
        --md-outlined-select-text-field-trailing-icon-color: #7ec8bc;
        --md-menu-container-color: #1c3540;
        --md-menu-item-label-text-color: #e8eef2;
      }
      .system-device-bar md-outlined-select {
        width: 100%;
        min-height: 36px;
      }
      .system-device-assoc {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 18px;
        font-size: 12px;
        color: #8aa0ab;
      }
      .system-device-assoc.is-on {
        color: #7ec8bc;
      }
      .system-device-assoc .widget-dot {
        flex: 0 0 auto;
      }
      .pane-grid.cols-1 { grid-template-columns: 1fr; }
      .pane-grid.cols-2 { grid-template-columns: 1fr 1fr; }
      .pane-grid.rows-2 { grid-template-rows: 1fr 1fr; }
      .pane-grid.quad { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
      .pane {
        min-height: 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: #152832;
      }
      .pane.is-active { box-shadow: none; }
      .pane-toolbar {
        flex: 0 0 auto;
        padding-right: 36px;
      }
      .pane-title {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 14px;
        font-weight: 500;
        line-height: 1.2;
        color: #e8eef2;
      }
      .pane-toolbar .pane-pager {
        flex: 0 0 auto;
        font-size: 12px;
        line-height: 1;
        white-space: nowrap;
        --lit-pagination-size: 20px;
        --lit-pagination-gap: 0;
        --lit-pagination-container-gap: 0;
        --lit-pagination-icon-size: 14px;
        --lit-pagination-field-direction: row;
        --lit-pagination-field-align: center;
        --lit-pagination-field-gap: 0;
        --lit-pagination-field-height: 20px;
        --lit-pagination-field-min-width: 0;
        --lit-pagination-field-margin: 0 0 0 2px;
        --lit-pagination-input-height: 18px;
        --lit-pagination-select-width: 40px;
        --lit-pagination-label-size: 11px;
        --lit-pagination-items-label-display: none;
      }
      .workspace-toolbar {
        flex: 0 0 auto;
      }
      .pane-title-icon {
        font-size: 18px;
        color: #7ec8bc;
      }
      .pane-body {
        flex: 1;
        overflow: auto;
        display: flex;
        flex-direction: column;
      }
      .pane-body.is-paged {
        overflow: hidden;
        gap: 8px;
      }
      .pane-pager {
        flex: 0 0 auto;
        --lit-pagination-selected-background: #1a3340;
        --lit-pagination-selected-color: #e8eef2;
      }
      .pane-list-scroll {
        flex: 1;
        min-height: 0;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
        scrollbar-width: thin;
        scrollbar-color: #3d9a8a #13242c;
      }
      .pane-list-scroll::-webkit-scrollbar {
        width: 8px;
      }
      .pane-list-scroll::-webkit-scrollbar-button {
        display: none;
        width: 0;
        height: 0;
        background: transparent;
      }
      .pane-list-scroll::-webkit-scrollbar-button:vertical:end:increment {
        display: block;
        width: 8px;
        height: 24px;
        background: #152832;
      }
      .pane-list-scroll::-webkit-scrollbar-track {
        background: #13242c;
        border-left: 1px solid rgba(126, 200, 188, 0.16);
      }
      .pane-list-scroll::-webkit-scrollbar-thumb {
        background: #3d9a8a;
        border-radius: 8px;
        border: 2px solid #13242c;
      }
      .pane-list-scroll::-webkit-scrollbar-thumb:hover {
        background: #7ec8bc;
      }
      .module-empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        text-align: center;
        color: #8aa0ab;
      }
      .module-empty md-icon {
        font-size: 36px;
        color: #7ec8bc;
        opacity: 0.7;
      }
      .module-empty-title {
        font-size: 14px;
        color: #e8eef2;
      }
      .device-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 0;
        background: transparent;
      }
      .list-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 36px;
        padding: 4px 6px 4px 10px;
        border: 1px solid rgba(126, 200, 188, 0.35);
        border-radius: 6px;
        background: #1a3340;
      }
      .list-row.is-on {
        border-color: rgba(126, 200, 188, 0.55);
      }
      button.list-row {
        width: 100%;
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      .list-row-data {
        display: flex;
        flex: 1;
        align-items: center;
        gap: 10px;
        min-width: 0;
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      div.list-row-data { cursor: default; }
      .list-row-name {
        flex: 1 1 88px;
        min-width: 72px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        color: #e8eef2;
      }
      .list-row-meta {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #7ec8bc;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .list-row-meta.is-muted { color: #8aa0ab; }
      .list-row-acts {
        display: flex;
        flex-shrink: 0;
        align-items: center;
        gap: 2px;
      }
      .device-list .device-action {
        display: inline-grid;
        place-items: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 0;
        border-radius: 14px;
        background: transparent;
        color: #7ec8bc;
        cursor: pointer;
      }
      .device-list .device-action md-icon {
        font-size: 18px;
        color: #7ec8bc;
      }
      .widget-item {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        height: 100%;
        overflow: hidden;
      }
      .widget-item.is-min .widget-card {
        flex: none;
        height: 100%;
      }
      .widget-card.v-card,
      .widget-card {
        position: relative;
        flex: 1;
        display: flex !important;
        flex-direction: column !important;
        min-width: 0;
        min-height: 0;
        height: 100%;
        overflow: hidden !important;
        background: #0c181f !important;
        color: #e8eef2;
        border: 1px solid rgba(126, 200, 188, 0.28);
        border-radius: 8px 8px 0 0 !important;
        box-shadow: none !important;
      }
      .widget-head {
        display: flex;
        align-items: center;
        box-sizing: border-box;
        gap: 8px;
        height: 36px;
        min-height: 36px;
        padding: 2px 10px;
        background: #1a3340;
        border-bottom: 1px solid rgba(126, 200, 188, 0.22);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
        cursor: grab;
        user-select: none;
      }
      .widget-item.is-min .widget-head {
        border-bottom: 0;
      }
      .widget-item.is-min .widget-body,
      .widget-item.is-min .grip {
        display: none;
      }
      .widget-item.is-off .widget-card {
        border-color: rgba(138, 160, 171, 0.28);
      }
      .widget-item.is-off .widget-head {
        background: #162228;
        cursor: grab;
      }
      .widget-item.is-off .widget-head-device-name,
      .widget-item.is-off .widget-head-icon-wrap,
      .widget-item.is-off .widget-head-icon-wrap md-icon {
        color: #8aa0ab;
      }
      .widget-item.is-off .widget-body {
        pointer-events: none;
        filter: grayscale(0.55);
        opacity: 0.55;
      }
      .widget-traffic {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
        margin-left: auto;
      }
      .widget-light {
        width: 12px;
        height: 12px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        cursor: pointer;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.28);
      }
      .widget-light.is-close { background: #ff5f57; }
      .widget-light.is-min { background: #febc2e; }
      .widget-light:hover { filter: brightness(1.08); }
      .widget-head-icon-wrap {
        display: inline-grid;
        place-items: center;
        width: 20px;
        height: 20px;
        color: #7ec8bc;
        overflow: visible;
      }
      lit-tooltip {
        --lit-tooltip-background: #152832;
        --lit-tooltip-text-color: #e8eef2;
        --lit-tooltip-opacity: 1;
        --lit-tooltip-font-size: 12px;
        --paper-tooltip-background: #152832;
        --paper-tooltip-text-color: #e8eef2;
      }
      .widget-head-icon-wrap md-icon {
        font-size: 18px;
        color: #7ec8bc;
      }
      .widget-head-copy {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 1px;
        min-width: 0;
        flex: 1;
      }
      .widget-head-devices {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .widget-head-desc {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 10px;
        line-height: 1.1;
        color: #8aa0ab;
      }
      .widget-head-device {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        flex: 1;
      }
      .widget-head-host {
        flex-shrink: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 10px;
        color: #8aa0ab;
      }
      .widget-head-device-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
        color: #e8eef2;
      }
      .widget-body {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 6px 10px 8px;
        background: #0c181f;
        scrollbar-width: thin;
        scrollbar-color: #3d9a8a #13242c;
      }
      .widget-body::-webkit-scrollbar {
        width: 8px;
      }
      .widget-body::-webkit-scrollbar-button {
        display: none;
        width: 0;
        height: 0;
        background: transparent;
      }
      .widget-body::-webkit-scrollbar-button:vertical:end:increment {
        display: block;
        width: 8px;
        height: 24px;
        background: #0c181f;
      }
      .widget-body:has(.scheduler)::-webkit-scrollbar-button:vertical:end:increment {
        background: #0a1014;
      }
      .widget-body::-webkit-scrollbar-track {
        background: #13242c;
        border-left: 1px solid rgba(126, 200, 188, 0.16);
      }
      .widget-body::-webkit-scrollbar-thumb {
        background: #3d9a8a;
        border-radius: 8px;
        border: 2px solid #13242c;
      }
      .widget-body::-webkit-scrollbar-thumb:hover {
        background: #7ec8bc;
      }
      .widget-body:has(.preview-stage) {
        display: flex;
        flex-direction: column;
        padding: 6px;
      }
      .preview-stage {
        flex: 0 0 auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        grid-auto-rows: minmax(120px, 1fr);
        gap: 6px;
        min-width: 0;
        min-height: 100%;
        overflow: hidden;
      }
      .preview-empty {
        display: grid;
        place-items: center;
        color: #8aa0ab;
        font-size: 12px;
      }
      .preview-window {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        background: #071116;
        border: 1px solid rgba(126, 200, 188, 0.22);
      }
      .preview-window.is-off {
        opacity: 0.55;
      }
      .preview-bezel {
        flex: 1;
        min-height: 0;
        padding: 4px;
        background: #101c22;
      }
      .preview-screen {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
        overflow: hidden;
        color: #e8eef2;
        background: #081014;
      }
      .preview-screen.is-led {
        background: linear-gradient(120deg, #0a2018, #12382c, #0d281c, #152a22);
        background-size: 220% 220%;
        animation: preview-shimmer 8s ease-in-out infinite alternate;
      }
      .preview-screen.is-sideline {
        background: linear-gradient(160deg, #10232c 0%, #1a3a46 42%, #0d1c22 100%);
        background-size: 180% 180%;
        animation: preview-shimmer 10s ease-in-out infinite alternate;
      }
      .preview-screen.is-idle {
        background: repeating-linear-gradient(
          45deg,
          #0b151a,
          #0b151a 8px,
          #0e1a20 8px,
          #0e1a20 16px
        );
      }
      .preview-screen.is-composite {
        display: grid;
        grid-template: 1fr / 1fr;
        background: #081014;
      }
      .preview-layer {
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      .preview-layer.is-fullscreen {
        grid-area: 1 / 1;
        background: linear-gradient(120deg, #0a2018, #12382c, #0d281c, #152a22);
        background-size: 220% 220%;
        animation: preview-shimmer 8s ease-in-out infinite alternate;
      }
      .preview-composite {
        grid-area: 1 / 1;
        z-index: 1;
        display: grid;
        grid-template:
          "main totem" 1fr
          "ticker ticker" 22px
          / 1fr 30%;
        gap: 3px;
        padding: 4px;
        min-height: 0;
      }
      .preview-layer.is-main {
        grid-area: main;
        display: flex;
        flex-direction: column;
        background: rgba(8, 20, 18, 0.72);
        border: 1px solid rgba(126, 200, 188, 0.28);
      }
      .preview-layer.is-totem {
        grid-area: totem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        background: rgba(16, 35, 44, 0.88);
        border: 1px solid rgba(126, 200, 188, 0.28);
        text-align: center;
      }
      .preview-layer.is-ticker {
        grid-area: ticker;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 6px;
        background: rgba(6, 12, 16, 0.86);
        border: 1px solid rgba(126, 200, 188, 0.22);
      }
      .preview-layer-name {
        position: absolute;
        top: 3px;
        left: 4px;
        z-index: 2;
        padding: 0 4px;
        font-size: 8px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #7ec8bc;
        background: rgba(7, 17, 22, 0.7);
      }
      .preview-layer.is-fullscreen > .preview-layer-name,
      .preview-screen > .preview-layer-name {
        top: 3px;
        right: 4px;
        left: auto;
      }
      .preview-ticker-text {
        overflow: hidden;
        white-space: nowrap;
        font-size: 9px;
        color: #d5dee3;
      }
      .preview-ticker-text span {
        display: inline-block;
        padding-left: 100%;
        animation: preview-ticker 8s linear infinite;
      }
      @keyframes preview-ticker {
        0% { transform: translateX(0); }
        100% { transform: translateX(-100%); }
      }

            state.workspaceEditOpen = false;
          }

          // ── Moduli e toolbar ────────────────────────────────────────────
          function hasModuleItems(moduleId) {
            if (moduleId === "host") return devices.length > 0;
            if (moduleId === "system") return systems.length > 0;
            if (moduleId === "standalone") return state.standalones.length > 0;
            if (moduleId === "palinsesto") return state.palinsesti.length > 0;
            if (moduleId === "soccer") return state.matches.length > 0;
            return false;
          }

          const groups = computed(() =>
            ["Core", "Extra"].map((name) => ({ name, items: modules.filter((m) => m.group === name) })),
          );

          const toolbarModules = computed(() =>
            ["settings", "auth"].map((id) => modules.find((m) => m.id === id)).filter(Boolean),
          );

          function isModuleActive(moduleId) {
            if (moduleId === "auth") return state.profileOpen;
            return state.panes.some((p) => p.id === state.activePane && p.module === moduleId);
          }

          function moduleOf(moduleId) {
            return modules.find((m) => m.id === moduleId) || modules[0];
          }

          function fieldValue(selector) {
            const field = document.querySelector(selector);
            return String(field?.value ?? "").trim();
          }

          function signIn() {
            const user = fieldValue("#login-user") || state.authUser.trim();
            const password = fieldValue("#login-password") || state.authPassword;
            state.authUser = user;
            state.authPassword = password;
            if (!user || !password) {
              state.authError = "Inserisci utente e password.";
              return;
            }
            if (user !== "fluid" || password !== "fluid") {
              state.authError = "Credenziali non valide.";
              return;
            }
            state.signedIn = true;
            state.profileOpen = false;
            state.authPassword = "";
            state.authError = "";
            nextTick(() => {
              bindHeaderActions();
              fitWorkspaceWidth();
              startClock();
            });
          }

          function signOut() {
            stopClock();
            state.signedIn = false;
            state.profileOpen = false;
            state.authUser = "";
            state.authPassword = "";
            state.authError = "";
          }

          // ── Widget: peer / sistema / stato ──────────────────────────────
          function widgetMeta(type) {
            return widgetCatalog.find((w) => w.type === type);
          }

          function widgetSystem(widget) {
            return systems.find((s) => s.id === widget.systemId) || null;
          }

          function widgetDevice(widget) {
            return devices.find((d) => d.id === widget.deviceId) || systemDevice(widgetSystem(widget)) || activeDevice.value;
          }

          // Un widget è attivo se il peer è autenticato e, se ha un sistema,
          // quel sistema è l'unico attivo del peer.
          function isWidgetEnabled(widget) {
            const device = widgetDevice(widget);
            if (!device?.authenticated) return false;
            const system = widgetSystem(widget);
            return system ? system.active && system.deviceId === device.id : true;
          }

          function widgetDevices(widget) {
            const device = widget ? widgetDevice(widget) : null;
            return device ? [device] : [];
          }

          function widgetMonitorCount(widget) {
            return widgetDevices(widget).reduce((sum, d) => sum + (d.monitors || 0), 0);
          }

          function widgetWindows(widget) {
            return widgetDevices(widget).flatMap((device) => {
              const online = device.authenticated;
              if (device.windows?.length) {
                return device.windows.map((w) => ({
                  ...w,
                  deviceName: device.name,
                  online,
                  devices: w.devices || [],
                }));
              }
              return Array.from({ length: device.monitors || 0 }, (_, index) => ({
                id: `${device.id}-${index}`,
                name: `Finestra ${index + 1}`,
                layout: "single",
                deviceName: device.name,
                online,
                devices: [{ id: "fullscreen", name: "FullScreen", theme: "idle", item: "Nessun contenuto" }],
              }));
            });
          }

          function windowDevice(win, deviceId) {
            return (win.devices || []).find((d) => d.id === deviceId);
          }

          function windowDeviceNames(win) {
            return (win.devices || []).map((d) => d.name).join(" · ");
          }

          const schedulerLayers = [
            { id: "background", name: "Background" },
            { id: "default", name: "Default" },
            { id: "overlay", name: "Overlay" },
          ];

          function widgetScheduler(widget) {
            return widgetDevices(widget).flatMap((device) =>
              (device.scheduler || []).map((entry) => ({ ...entry, hostName: device.name })),
            );
          }

          function schedulerMaxDuration(widget) {
            let max = 1;
            for (const entry of widgetScheduler(widget)) {
              for (const layer of schedulerLayers) {
                for (const clip of entry[layer.id] || []) {
                  max = Math.max(max, Number(clip.duration) || 0);
                }
              }
            }
            return max;
          }

          function clipStyle(clip, max) {
            const duration = Number(clip.duration) || 1;
            const elapsed = Number(clip.elapsed) || 0;
            return {
              width: Math.max(10, (duration / (max || duration)) * 100) + "%",
              "--progress": Math.min(100, (elapsed / duration) * 100) + "%",
            };
          }

          function widgetStatus(widget) {
            const device = widgetDevice(widget);
            if (device) return device.authenticated ? "peer online" : "peer offline";
            if (widget.type === "mixer") return state.mixer + "%";
            return "";
          }

          // ── Griglia condivisa dell'area di lavoro ───────────────────────
          function gridColCount() {
            return getGridEl()?.colCount ?? 40;
          }

          function rectsOverlap(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
          }

          function canPlace(rect, ignoreId) {
            if (rect.x < 0 || rect.y < 0 || rect.w < MIN_WIDGET_W || rect.h < MIN_WIDGET_H || rect.x + rect.w > gridColCount()) {
              return false;
            }
            return !visibleWidgets.value.some((w) => w.id !== ignoreId && rectsOverlap(rect, w));
          }

          function findFree(w, h) {
            const cols = gridColCount();
            const width = Math.min(Math.max(w, MIN_WIDGET_W), cols);
            const height = Math.max(h, MIN_WIDGET_H);
            const maxY = visibleWidgets.value.reduce((acc, item) => Math.max(acc, item.y + item.h), 0) + 16;
            for (let y = 0; y <= maxY; y += 1) {
              for (let x = 0; x <= cols - width; x += 1) {
                const rect = { x, y, w: width, h: height };
                if (canPlace(rect)) return rect;
              }
            }
            return { x: 0, y: maxY, w: width, h: height };
          }

          function addWidgetRowHeight() {
            const grid = getGridEl();
            const headerPx = 36;
            if (!grid) return 3;
            const unit = (grid.cellHeight || 8) + (grid.cellMargin || 6);
            return Math.max(1, Math.ceil((headerPx + (grid.cellMargin || 6)) / unit));
          }

          function toggleMinimize(widget) {
            if (widget.collapsed) {
              widget.collapsed = false;
              widget.h = widget.expandedH || 12;
            } else {
              widget.expandedH = widget.h;
              widget.collapsed = true;
              widget.h = addWidgetRowHeight();
            }
            recomputeGrid();
          }

          function onGridCommit(event) {
            const tile = event.detail?.tile ?? event.currentTarget;
            if (!(tile instanceof HTMLElement)) return;
            const widget = visibleWidgets.value.find((w) => w.id === tile.dataset.widgetId);
            if (!widget) return;
            widget.x = Number(tile.getAttribute("col"));
            widget.y = Number(tile.getAttribute("row"));
            widget.w = Number(tile.getAttribute("width"));
            widget.h = Number(tile.getAttribute("height"));
            if (!widget.collapsed) widget.expandedH = widget.h;
          }

          // ── Aggiunta widget: scelta peer connesso, poi tipo ─────────────
          function themeMdDialogs() {
            const css = [
              ":host{height:auto!important;min-height:0!important;width:min(var(--md-dialog-container-max-width,480px),calc(100vw - 48px))!important;max-width:min(var(--md-dialog-container-max-width,480px),calc(100vw - 48px));max-height:min(560px,calc(100vh - 48px));}",
              "dialog[open]{position:fixed;inset:auto;top:0;right:0;bottom:0;left:0;margin:auto;height:fit-content!important;max-height:min(560px,calc(100vh - 48px))!important;min-height:0!important;width:min(var(--md-dialog-container-max-width,480px),calc(100vw - 48px))!important;}",
              ".container{display:flex!important;flex-direction:column!important;flex:none!important;max-height:min(560px,calc(100vh - 48px));overflow:hidden!important;border-radius:8px!important;border:1px solid rgba(126,200,188,.18);box-shadow:0 8px 24px rgba(0,0,0,.4);}",
              ".scroller{flex:1 1 auto!important;min-height:0!important;overflow:auto!important;scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:#3d9a8a #13242c;}",
              ".scroller::-webkit-scrollbar{width:8px;}",
              ".scroller::-webkit-scrollbar-button{display:none;width:0;height:0;background:transparent;}",
              ".scroller::-webkit-scrollbar-button:vertical:end:increment{display:block;width:8px;height:24px;background:#152832;}",
              ".scroller::-webkit-scrollbar-track{background:#13242c;border-left:1px solid rgba(126,200,188,.16);}",
              ".scroller::-webkit-scrollbar-thumb{background:#3d9a8a;border-radius:8px;border:2px solid #13242c;}",
              ".scroller::-webkit-scrollbar-thumb:hover{background:#7ec8bc;}",
              ".content{flex:none!important;height:auto!important;overflow:visible!important;}",
              ".headline,.actions{flex:none!important;overflow:visible!important;}",
              "slot[name=headline]::slotted(*){padding:20px 20px 12px!important;overflow:visible!important;}",
              "slot[name=content]::slotted(*){padding:4px 20px 12px!important;overflow:visible!important;}",
              "slot[name=actions]::slotted(*){padding:8px 16px 16px!important;overflow:visible!important;justify-content:flex-end!important;flex-wrap:nowrap!important;gap:8px!important;}",
            ].join("");
            const buttonCss = [
              ":host{min-width:max-content!important;width:auto!important;padding-inline:16px!important;border-radius:4px!important;}",
              ".label{overflow:visible!important;}",
            ].join("");
            document.querySelectorAll("md-dialog").forEach((dialog) => {
              if (!dialog.shadowRoot) return;
              let style = dialog.shadowRoot.querySelector("style[data-regista-dialog]");
              if (!style) {
                style = document.createElement("style");
                style.dataset.registaDialog = "1";
                dialog.shadowRoot.appendChild(style);
              }
              style.textContent = css;
              dialog.querySelectorAll("md-text-button, md-filled-button, md-filled-tonal-button").forEach((button) => {
                if (!button.shadowRoot) return;
                let buttonStyle = button.shadowRoot.querySelector("style[data-regista-btn]");
                if (!buttonStyle) {
                  buttonStyle = document.createElement("style");
                  buttonStyle.dataset.registaBtn = "1";
                  button.shadowRoot.appendChild(buttonStyle);
                }
                buttonStyle.textContent = buttonCss;
              });
            });
          }

          function openAddWidget() {
            state.addDeviceId = activeDevice.value?.id || connectedDevices.value[0]?.id || "";
            state.addStep = "peers";
            state.addOpen = true;
            nextTick(() => {
              themeMdDialogs();
              requestAnimationFrame(themeMdDialogs);
            });
          }

          function resetAddWidget() {
            state.addStep = "peers";
            state.addDeviceId = activeDevice.value?.id || connectedDevices.value[0]?.id || "";
          }

          function onAddDialogClosed() {
            state.addOpen = false;
            resetAddWidget();
          }

          function selectAddDevice(deviceId) {
            state.addDeviceId = deviceId;
          }

          function goAddWidgetTypes() {
            if (state.addDeviceId) state.addStep = "widgets";
            nextTick(themeMdDialogs);
          }

          function addWidget(type) {
            const device = connectedDevices.value.find((d) => d.id === state.addDeviceId);
            if (!device) return;
            const system = deviceActiveSystem(device);
            const meta = widgetMeta(type);
            const rect = findFree(meta.w, meta.h);
            widgetSeq += 1;
            activeWorkspace.value.widgets.push({
              id: "w" + widgetSeq,
              type,
              collapsed: false,
              deviceId: device.id,
              systemId: system?.id || "",
              ...rect,
            });
            state.addOpen = false;
          }

          function removeWidget(id) {
            const ws = activeWorkspace.value;
            if (!ws) return;
            ws.widgets = ws.widgets.filter((w) => w.id !== id);
          }

          // ── Layout pannelli e area di lavoro ────────────────────────────
          function openModule(moduleId) {
            if (moduleId === "auth") {
              state.profileOpen = !state.profileOpen;
              return;
            }
            if (moduleId === "dashboard") {
              state.workspaceOpen = true;
              fitWorkspaceWidth();
              return;
            }
            if (!state.navOpen || !state.panes.length) {
              paneSeq += 1;
              const pane = { id: "p" + paneSeq, module: moduleId };
              state.panes = [pane];
              state.activePane = pane.id;
              state.split = "single";
              state.navOpen = true;
              return;
            }
            const pane = state.panes.find((p) => p.id === state.activePane) || state.panes[0];
            pane.module = moduleId;
          }

          function fitWorkspaceWidth() {
            nextTick(() => {
              const split = document.querySelector(".main-split");
              if (!split) return;
              const total = split.getBoundingClientRect().width;
              const max = Math.max(280, total - 240);
              state.workspaceWidth = Math.min(Math.max(Math.round(total * 0.75), 280), max);
            });
          }

          function startResize(event) {
            event.preventDefault();
            state.resizing = true;
            const split = event.currentTarget.parentElement;
            const onMove = (e) => {
              const rect = split.getBoundingClientRect();
              const width = rect.right - e.clientX;
              const max = Math.max(280, rect.width - 240);
              state.workspaceWidth = Math.min(Math.max(width, 280), max);
            };
            const onUp = () => {
              state.resizing = false;
              window.removeEventListener("mousemove", onMove);
              window.removeEventListener("mouseup", onUp);
            };
            window.addEventListener("mousemove", onMove);
            window.addEventListener("mouseup", onUp);
          }

          function applySplit(mode) {
            const first = state.panes[0] || { module: "host" };
            const count = mode === "quad" ? 4 : mode === "single" ? 1 : 2;
            const next = [];
            for (let i = 0; i < count; i += 1) {
              if (state.panes[i]) {
                next.push(state.panes[i]);
              } else {
                paneSeq += 1;
                next.push({ id: "p" + paneSeq, module: first.module });
              }
            }
            state.panes = next;
            state.split = mode;
            if (!next.find((p) => p.id === state.activePane)) state.activePane = next[0].id;
          }

          function splitBeside() {
            if (state.panes.length >= 4 || state.split === "rows") return applySplit("quad");
            applySplit(state.panes.length === 1 ? "cols" : "quad");
          }

          function splitBelow() {
            if (state.panes.length >= 4 || state.split === "cols") return applySplit("quad");
            applySplit(state.panes.length === 1 ? "rows" : "quad");
          }

          function closePane(id) {
            state.panes = state.panes.filter((p) => p.id !== id);
            if (!state.panes.length) {
              state.navOpen = false;
              state.split = "single";
              return;
            }
            if (state.panes.length === 1) state.split = "single";
            else if (state.panes.length === 2) state.split = state.split === "quad" ? "cols" : state.split;
            if (state.activePane === id) state.activePane = state.panes[0].id;
          }

          function bindHeaderActions() {
            const header = document.querySelector("app-header");
            if (!header || header.dataset.bound === "1") return;
            header.dataset.bound = "1";
            header.querySelectorAll("[data-action]").forEach((el) => {
              el.setAttribute("slot", "end");
              if (el.dataset.action === "module:auth") return;
              const target = el.querySelector("md-icon-button") ?? el;
              target.addEventListener("click", () => {
                const action = el.dataset.action;
                if (action === "workspace") {
                  state.workspaceOpen = !state.workspaceOpen;
                  if (state.workspaceOpen) fitWorkspaceWidth();
                  return;
                }
                if (action && action.startsWith("module:")) openModule(action.slice(7));
              });
            });
          }

          function onDocumentClick(event) {
            if (!state.profileOpen) return;
            const menu = document.querySelector(".profile-menu");
            const auth = document.querySelector('[data-action="module:auth"]');
            const path = event.composedPath();
            if ((menu && path.includes(menu)) || (auth && path.includes(auth))) return;
            state.profileOpen = false;
          }

          // ── Partite ─────────────────────────────────────────────────────
          function currentMatch() {
            return state.matches.find((m) => m.id === state.activeMatchId) || state.matches[0] || null;
          }

          const activeMatch = computed(() => currentMatch());

          // Si cambia partita solo dal pallino verde/rosso nella lista.
          function selectMatch(match) {
            if (!match || state.activeMatchId === match.id) return;
            state.activeMatchId = match.id;
          }

          function matchTitle(match) {
            return match?.title || `${match?.home?.name || "—"} — ${match?.away?.name || "—"}`;
          }

          function widgetHint(widget) {
            if (!widgetDevice(widget)?.authenticated) return "Peer disconnesso";
            const system = widgetSystem(widget);
            if (system && !system.active) return "Sistema non attivo";
            if (widget.type === "match" && activeMatch.value) return `Partita corrente · ${matchTitle(activeMatch.value)}`;
            return widgetMeta(widget.type).hint;
          }

          // Orologio in decimi di secondo.
          function formatTenths(value) {
            const tenths = Math.max(0, Number(value) || 0);
            const minutes = String(Math.floor(tenths / 600)).padStart(2, "0");
            const seconds = String(Math.floor((tenths % 600) / 10)).padStart(2, "0");
            return `${minutes}:${seconds}.${tenths % 10}`;
          }

          function matchClockLabel(match) {
            const m = match || currentMatch();
            return formatTenths(m?.clock);
          }

          function matchMinuteLabel(match) {
            const m = match || currentMatch();
            return `${Math.floor((m?.clock || 0) / 600)}'`;
          }

          function matchScore(team, match) {
            return ((match || currentMatch())?.events || []).filter((e) => e.team === team && e.type === "goal").length;
          }

          // Il nome viene preso a rotazione dai titolari della squadra.
          function nextPlayerName(team) {
            const match = currentMatch();
            const starters = match?.[team]?.starters || [];
            if (!starters.length) return "—";
            if (!match.nameCursor) match.nameCursor = { home: 0, away: 0 };
            const player = starters[match.nameCursor[team] % starters.length];
            match.nameCursor[team] += 1;
            return player.name;
          }

          function pushMatchEvent(team, type, text) {
            const match = currentMatch();
            if (!match) return;
            matchEventSeq += 1;
            match.events.push({ id: "e" + matchEventSeq, team, type, minute: matchMinuteLabel(match), text });
          }

          function addMatchGoal(team) {
            pushMatchEvent(team, "goal", nextPlayerName(team));
          }

          function addMatchCard(team, type) {
            pushMatchEvent(team, type, nextPlayerName(team));
          }

          function addMatchSub(team) {
            const side = currentMatch()?.[team];
            if (!side?.starters.length || !side.bench.length) return;
            const out = side.starters[side.starters.length - 1];
            const into = side.bench[0];
            side.starters.splice(side.starters.length - 1, 1);
            side.bench.splice(0, 1);
            side.starters.push(into);
            side.bench.push(out);
            pushMatchEvent(team, "sub", `${out.name} → ${into.name}`);
          }

          function cycleMatchPeriod() {
            const match = currentMatch();
            if (!match) return;
            match.period = (match.period + 1) % match.periods.length;
            if (match.period === 0) match.clock = 0;
            else if (match.period === 1) match.clock = 45 * 600;
            else if (match.period === 2) match.clock = 90 * 600;
            else if (match.period === 3) match.clock = 105 * 600;
            else match.clock = 120 * 600;
            match.running = false;
          }

          function toggleMatchClock() {
            const match = currentMatch();
            if (!match) return;
            match.running = !match.running;
          }

          function matchEventLabel(type) {
            if (type === "goal") return "gol";
            if (type === "yellow") return "giallo";
            if (type === "red") return "rosso";
            return "sub";
          }

          function matchEventDot(type) {
            if (type === "yellow") return "is-warn";
            if (type === "red") return "is-off";
            if (type === "sub") return "is-idle";
            return "";
          }

          function recentMatchEvents(match) {
            return ((match || currentMatch())?.events || []).slice(-3).reverse();
          }

          // ── Palinsesti e standalone ─────────────────────────────────────
          const palinsestoLayers = [
            { id: "background", name: "BG" },
            { id: "default", name: "DEF" },
            { id: "overlay", name: "OVR" },
          ];

          function palinsestoStatusLabel(status) {
            if (status === "running") return "running";
            if (status === "paused") return "pausa";
            return "stop";
          }

          function palinsestoDot(status) {
            if (status === "running") return "";
            if (status === "paused") return "is-warn";
            return "is-idle";
          }

          function setPalinsestoLayer(item, layer) {
            item.layer = layer;
          }

          // Un solo palinsesto in onda: il play ferma gli altri in riproduzione.
          function playPalinsesto(item) {
            state.palinsesti.forEach((p) => {
              if (p.id !== item.id && p.status === "running") {
                p.status = "idle";
                p.elapsed = 0;
              }
            });
            if (item.status === "idle") item.elapsed = 0;
            item.status = "running";
          }

          function pausePalinsesto(item) {
            if (item.status === "running") item.status = "paused";
          }

          function stopPalinsesto(item) {
            item.status = "idle";
            item.elapsed = 0;
          }

          // In onda: quello in running, altrimenti quello in pausa.
          function currentPalinsesto() {
            return (
              state.palinsesti.find((p) => p.status === "running") ||
              state.palinsesti.find((p) => p.status === "paused") ||
              null
            );
          }

          // Rundown: 2 item prima, quello corrente e 3 dopo.
          function palinsestoRundown(palinsesto) {
            const items = palinsesto?.items || [];
            if (!items.length) return { rows: [], current: null };
            const total = items.reduce((sum, it) => sum + (Number(it.duration) || 0), 0) || 1;
            const elapsed = Math.max(0, Number(palinsesto.elapsed) || 0) % total;
            let acc = 0;
            let index = 0;
            let local = 0;
            for (let i = 0; i < items.length; i += 1) {
              const duration = Number(items[i].duration) || 0;
              if (elapsed < acc + duration || i === items.length - 1) {
                index = i;
                local = Math.min(elapsed - acc, duration);
                break;
              }
              acc += duration;
            }
            const current = items[index];
            const currentDuration = Number(current.duration) || 1;
            const from = Math.max(0, index - 2);
            const to = Math.min(items.length, index + 4);
            const rows = items.slice(from, to).map((item, offset) => {
              const i = from + offset;
              const role = i < index ? "prima" : i === index ? "on air" : "dopo";
              return {
                ...item,
                role,
                now: i === index,
                past: i < index,
                progress: i === index ? Math.min(100, (local / currentDuration) * 100) : 0,
                local: i === index ? local : 0,
              };
            });
            return { rows, current, local, index };
          }

          const onAirPalinsesto = computed(() => currentPalinsesto());
          const onAirRundown = computed(() => palinsestoRundown(onAirPalinsesto.value));

          const pagedPalinsesti = computed(() => {
            const per = state.palinsestoPerPage;
            const start = (state.palinsestoPage - 1) * per;
            return state.palinsesti.slice(start, start + per);
          });

          function onPalinsestoPage(event) {
            const page = Number(event.detail?.page);
            if (Number.isFinite(page) && page >= 1) state.palinsestoPage = page;
          }

              state.standalones.forEach((s) => {

            }, 100);

            clearInterval(clockTimer);
            clockTimer = null;
